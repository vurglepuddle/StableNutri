name: Stable checks

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter-cache
      - name: Configure placeholders
        run: cp .env.example .env
      - name: Install packages
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Generate models
        run: dart run build_runner build
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/core lib/features lib/l10n test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
